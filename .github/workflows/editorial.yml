name: X Editorial Engine

on:
  schedule:
    - cron: "17 8,12,16,20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate without changing state or sending Telegram"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: x-editorial-engine
  cancel-in-progress: false

jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate reviewed X draft
        env:
          EDITOR_TELEGRAM_TOKEN: ${{ secrets.EDITOR_TELEGRAM_TOKEN }}
          EDITOR_CHAT_ID: ${{ secrets.EDITOR_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python x_engine.py --dry-run
          else
            python x_engine.py
          fi
      - name: Persist bounded state and latest outbox
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          git config user.name "isitcooked-editorial-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json outbox/latest.json
          git diff --cached --quiet || git commit -m "chore: update X editorial queue [skip ci]"
          git push

